        - in: query
          name: date_to
          schema:
            type: string
            format: yyyy-mm-dd
          required: false
          description: Filter by datetime (created_at)
        - in: query
          name: page
          description: Page number for pagination (default is 1)
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
