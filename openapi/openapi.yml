    post:
      tags:
        - Deals API
      security:
        - apiToken: []
      summary: Cancel the Deal
      description: Only Deal with status draft, submitted, payment_pending, paid,
        executing can be cancelled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deal_party:
                  type: string
                  enum:
                    - buyer
                    - seller
                    - broker
                  description: Party who initiates the cancellation, required for cancel action
                reason:
                  type: integer
                  description: Cancel reason ID, required for cancel action
                comment:
                  type: string
                  description: Comment for cancel action, required for cancel action
              required:
                - deal_party
                - reason
                - comment
              examples:
                - deal_party: buyer
                  reason: 1
                  comment: Changed my mind, I want to cancel the deal
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
