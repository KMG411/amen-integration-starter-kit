openapi: 3.1.1
info:
  title: Amen Platform Public API
  version: "1.0"
tags:
  - name: Lookup API
    description: Lookup API
  - name: Account API
    description: Account API
  - name: Customers API
    description: Customers API
  - name: Deals API
    description: Deals API
  - name: Withdrawal API
    description: Withdrawal API
  - name: Webhooks API
    description: Webhooks API
servers:
  - url: https://sandbox-api.amnn.sa
    description: Sandbox API server
  - url: https://api.amnn.sa
    description: Live API server
components:
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: X-API-Token
      description: API token for authentication, can be obtained from the Amen platform
  schemas:
    City:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Localized name
      examples:
        - id: 100
          name: Riyadh
    Page:
      type: object
      properties:
        pages:
          type: integer
          minimum: 1
        total:
          type: integer
        page:
          type: integer
      examples:
        - pages: 1
          total: 1
          page: 0
    PaymentMethod:
      type: string
      enum:
        - applepay
        - mada
        - visa_master
    DisputeReason:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Localized dispute reason name
    DisputeResolutionReason:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Localized dispute reason name
    CancelReason:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Localized cancel reason name
    PaymentProvider:
      type: string
      enum:
        - hyperpay
    PaymentStatus:
      type: string
      enum:
        - created
        - paid
        - failed
        - expired
        - canceled
    PaymentSubStatus:
      type: string
      enum:
        - card_invalid
        - cvv_invalid
        - expiry_invalid
        - card_blocked
        - invalid_tries_limit
        - client_limit_exceeded
        - insufficient_funds
        - bin_blacklisted
        - unknown
    Checkout:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: integer
          format: Timestamp with milliseconds
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        hyperpay:
          type: object
          properties:
            checkout_id:
              type: string
        amount:
          type: string
          description: Amount in SAR, formatted as decimal with 2 digits (e.g. "100.00")
      examples:
        - id: 1
          created_at: 1679568486000
          provider: hyperpay
          hyperpay:
            checkout_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          amount: "100.00"
    Payment:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: integer
          format: Timestamp with milliseconds
        updated_at:
          type: integer
          format: Timestamp with milliseconds
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        substatus:
          oneOf:
            - $ref: "#/components/schemas/PaymentSubStatus"
            - type: "null"
        amount:
          type: string
          description: Amount in SAR, formatted as decimal with 2 digits (e.g. "100.00")
      examples:
        - id: 1
          created_at: 1679568486000
          updated_at: 1679568486000
          provider: hyperpay
          status: paid
          substatus: null
          amount: "100.00"
        - id: 2
          created_at: 1679568486000
          updated_at: 1679568486000
          provider: hyperpay
          status: failed
          substatus: insufficient_funds
          amount: "100.00"
    WithdrawalStatus:
      type: string
      enum:
        - submitted
        - processing
        - completed
        - failed
        - returned
    FeeType:
      type: string
      enum:
        - fixed
        - percent
    FeeConditions:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/FeeType"
        value:
          type: integer
          description: Fee value, might be amount (type=fixed) or percent (type=percent).
            Multiplied by 100 in both cases
        amount_min:
          type:
            - integer
            - "null"
          description: Fee value minimum amount, multiplied by 100 in both cases. This
            value appears only for type=percent
        amount_max:
          type:
            - integer
            - "null"
          description: Fee value minimum amount, multiplied by 100 in both cases. This
            value appears only for type=percent
      examples:
        - type: percent
          value: 100
          amount_min: 1000
          amount_max: 10000
    TopUpAccount:
      type: object
      properties:
        name:
          type: string
          description: Account holder name
        bank:
          type: string
          description: Bank name
        account_number:
          type: string
          description: Bank account number
        iban:
          type: string
          description: Bank account IBAN
      examples:
        - name: John Doe
          bank: Al Rajhi Bank
          account_number: "1234567890"
          iban: SA4420000001234567891234
    Bank:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bic:
          type: string
        title:
          type: string
          description: Localized bank title
      examples:
        - id: hb1e8c9a-0869-11eb-9f01-cb90251d5fe7
          bic: SABBSARI
          title: Saudi British Bank
    BankAccountStatus:
      type: string
      enum:
        - added
        - verified
        - declined
    BankAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: integer
          format: Timestamp with milliseconds
        bank:
          $ref: "#/components/schemas/Bank"
        iban:
          type: string
        proof_document:
          type:
            - string
            - "null"
          format: url
        default:
          type: boolean
        status:
          $ref: "#/components/schemas/BankAccountStatus"
      examples:
        - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
          created_at: 1679568486000
          bank:
            id: hb1e8c9a-0869-11eb-9f01-cb90251d5fe7
            bic: SABBSARI
            title: Saudi British Bank
          iban: SA4420000001234567891234
          proof_document: https://example.com/proof_document.jpg
          default: true
          status: added
    Withdrawal:
      type: object
      properties:
        number:
          type: string
          description: Withdrawal request number
        created_at:
          type: integer
          format: Timestamp with milliseconds
        updated_at:
          type: integer
          format: Timestamp with milliseconds
        execution_after:
          type: integer
          format: Timestamp with milliseconds
        bank_account:
          $ref: "#/components/schemas/BankAccount"
        amount:
          type: string
          description: Amount in Saudi Riyals, formatted as decimal with 2 digits (e.g.
            "100.00")
        fee:
          type: string
          description: Withdrawal fee in Saudi Riyals, formatted as decimal with 2 digits
            (e.g. "10.00")
        fee_conditions:
          $ref: "#/components/schemas/FeeConditions"
        vat:
          type: string
          description: Withdrawal fee VAT in Saudi Riyals, formatted as decimal with 2
            digits (e.g. "1.50")
        total:
          type: string
          description: Final amount to withdraw in Saudi Riyals, formatted as decimal with
            2 digits (e.g. "110.00")
        status:
          $ref: "#/components/schemas/WithdrawalStatus"
      examples:
        - number: WR-10001
          created_at: 1679568486000
          updated_at: 1679568486000
          execution_after: 1679654886000
          bank_account:
            id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
            created_at: 1679568486000
            bank:
              id: hb1e8c9a-0869-11eb-9f01-cb90251d5fe7
              bic: SABBSARI
              title: Saudi British Bank
            iban: SA4420000001234567891234
            proof_document: https://example.com/proof_document.jpg
            default: true
            status: added
          amount: "1000.00"
          fee: "10.00"
          fee_conditions:
            type: percent
            value: 100
            amount_min: 1000
            amount_max: 10000
          vat: "1.50"
          total: "110.00"
          status: pending
    WithdrawalsPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Withdrawal"
    AttachmentType:
      type: string
      enum:
        - picture
        - video
        - file
    AttachmentStatus:
      type: string
      enum:
        - processing
        - available
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AttachmentType"
        status:
          $ref: "#/components/schemas/AttachmentStatus"
        object_url:
          type: string
          format: url
        object_width:
          type: integer
          description: Preview file width
        object_height:
          type: integer
          description: Preview file height
        preview_url:
          type: string
          format: url
        preview_width:
          type: integer
          description: Preview file width
        preview_height:
          type: integer
          description: Preview file height
        title:
          type:
            - string
            - "null"
        filename:
          type: string
          description: Localized attachment name
        size_bytes:
          type: integer
        duration:
          type: integer
        uploaded_at:
          type: integer
          format: Timestamp with milliseconds
      examples:
        - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
          type: picture
          status: available
          object_url: https://example.com/picture.jpg
          object_width: 200
          object_height: 266
          preview_url: https://example.com/preview.jpg
          preview_width: 200
          preview_height: 266
          title: picture.png
          filename: Attachment name
          size_bytes: 1024
          duration: 50
          uploaded_at: 1679568486000
    Error:
      type: object
      properties:
        error:
          type: array
          items:
            type: string
    AccountWallet:
      type: object
      properties:
        balance:
          type: string
          description: Total balance, including escrow and holded funds in SAR
        available:
          type: string
          description: Funds available in SAR
        escrow:
          type: string
          description: Funds held in escrow in SAR
        on_hold:
          type: string
          description: Funds holded in SAR
        top_up_account:
          $ref: "#/components/schemas/TopUpAccount"
      examples:
        - balance: "1000.00"
          available: "1000.00"
          escrow: "0.00"
          on_hold: "0.00"
          top_up_account:
            name: John Doe
            bank: Al Rajhi Bank
            account_number: "1234567890"
            iban: SA4420000001234567891234
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sandbox_api_enabled:
          type: boolean
        live_api_enabled:
          type: boolean
        broker_account:
          type: object
          properties:
            number:
              type: string
              description: Customer number in the system, human readable
            wallet:
              $ref: "#/components/schemas/AccountWallet"
      examples:
        - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
          name: John's Electronics
          sandbox_api_enabled: true
          live_api_enabled: false
          broker_account:
            number: IC-0001
            wallet:
              balance: "1000.00"
              available: "1000.00"
              escrow: "0.00"
              on_hold: "0.00"
              top_up_account:
                name: John Doe
                bank: Al Rajhi Bank
                account_number: "1234567890"
                iban: SA4420000001234567891234
    CustomerType:
      type: string
      enum:
        - regular
        - broker
    CustomerStatus:
      type: string
      enum:
        - created
        - active
        - inactive
    CustomerAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/City"
        district:
          type:
            - string
            - "null"
        street:
          type:
            - string
            - "null"
        building_number:
          type:
            - string
            - "null"
        unit_number:
          type:
            - string
            - "null"
        zip_code:
          type:
            - string
            - "null"
      examples:
        - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
          city:
            id: 100
            name: Riyadh
          district: Al Olaya
          street: Al Olaya, Riyadh
          building_number: "123"
          unit_number: "456"
          zip_code: "12345"
    CustomerShort:
      type: object
      properties:
        number:
          type: string
          description: Customer number in the system, human readable
        full_name:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
          description: Phone number in the international format
        status:
          $ref: "#/components/schemas/CustomerStatus"
      examples:
        - number: IC-0001
          full_name: John Dou
          phone: "+966572000000"
          status: active
    CustomerDetails:
      type: object
      properties:
        number:
          type: string
          description: Customer number in the system, human readable
        first_name:
          type:
            - string
            - "null"
        last_name:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
          description: Phone number in the international format
        phone_code:
          type:
            - string
            - "null"
        phone_number:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/CustomerStatus"
      examples:
        - number: IC-0001
          first_name: John
          last_name: Dou
          phone: "+966572000000"
          phone_code: SA
          phone_number: "572000000"
          status: active
    CustomersPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/CustomerShort"
      examples:
        - pages: 1
          total: 1
          page: 0
          results:
            - number: IC-0001
              full_name: John Dou
              phone: "+966572000000"
              status: active
    OfferType:
      type: string
      enum:
        - product
        - service
    PriceType:
      type: string
      enum:
        - per_item
        - per_hour
        - average
    DealPartyType:
      type: string
      enum:
        - seller
        - buyer
        - broker
    DealStatus:
      type: string
      enum:
        - draft
        - requested
        - payment_pending
        - paid
        - executing
        - executed
        - completed
        - disputed
        - dispute_approved
        - canceled
        - payment_overdue
    Category:
      type: object
      properties:
        id:
          type: string
          format: integer
        name:
          type: string
          description: Localized category name
      examples:
        - id: "1"
          name: Electronics
    DealOffer:
      type: object
      properties:
        id:
          type: string
          description: Offer number
        number:
          type: string
          description: Offer number in the system, human readable
        title:
          type: string
          description: Offer title
        description:
          type:
            - string
            - "null"
          description: Offer description
        type:
          $ref: "#/components/schemas/OfferType"
        category:
          $ref: "#/components/schemas/Category"
        price:
          type: string
          description: Offer price in Saudi Riyals
        price_type:
          $ref: "#/components/schemas/PriceType"
      examples:
        - id: "1"
          number: OF-10001
          title: iPhone 12 for sale
          description: Brand new iPhone 12 for sale. Unlocked, with original box and
            accessories.
          type: product
          category:
            id: "1"
            name: Electronics
          price: "1000.00"
          price_type: per_item
    DealParty:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/CustomerShort"
        type:
          $ref: "#/components/schemas/DealPartyType"
      examples:
        - customer:
            number: IC-0001
            full_name: John Dou
            phone: "+966572000000"
            status: active
          type: buyer
    DealShort:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Deal number in the system, human readable
        customer:
          $ref: "#/components/schemas/CustomerShort"
        amount:
          type: number
          format: float
        status:
          $ref: "#/components/schemas/DealStatus"
      examples:
        - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
          number: ID-0001
          customer:
            id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
            number: IC-0001
            full_name: John Dou
            phone: "+966572000000"
          amount: 1000
          status: requested
    DealsPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/DealShort"
      examples:
        - pages: 1
          total: 1
          page: 0
          results:
            - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
              number: ID-0001
              customer:
                id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
                number: IC-0001
                full_name: John Dou
                phone: "+966572000000"
              amount: 1000
              status: requested
    DealDetails:
      type: object
      properties:
        id:
          type: string
          description: Deal ID
        created_at:
          type: integer
          format: Timestamp with milliseconds
        updated_at:
          type: integer
          format: Timestamp with milliseconds
        number:
          type: string
          description: Deal number in the system, human readable
        offer:
          $ref: "#/components/schemas/DealOffer"
        subject_details:
          type:
            - string
            - "null"
          description: Details of the deal subject (e.g. item condition, service scope, etc
        buyer:
          $ref: "#/components/schemas/CustomerShort"
        seller:
          $ref: "#/components/schemas/CustomerShort"
        billing_address:
          $ref: "#/components/schemas/CustomerAddress"
        delivery_address:
          $ref: "#/components/schemas/CustomerAddress"
        price:
          type: string
          description: Offer price in Saudi Riyals
        delivery_fee:
          type: string
          description: Delivery fee in Saudi Riyals
        buyer_fee:
          type: string
          description: Buyer fee in Saudi Riyals
        seller_fee:
          type: string
          description: Seller fee in Saudi Riyals
        service_fee:
          type: string
          description: Service fee in Saudi Riyals
        total:
          type: string
          description: Total deal price in Saudi Riyals
        seller_amount_transfered:
          type: boolean
        status:
          $ref: "#/components/schemas/DealStatus"
        dispute_reason:
          oneOf:
            - $ref: "#/components/schemas/DisputeReason"
            - type: "null"
        dispute_comment:
          type:
            - string
            - "null"
          description: Dispute comment left by buyer or seller when creating a dispute
        dispute_attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
          description: Dispute attachments uploaded by buyer or seller when creating a
            dispute
        dispute_resolution_reason:
          oneOf:
            - $ref: "#/components/schemas/DisputeResolutionReason"
            - type: "null"
        dispute_resolution_comment:
          type:
            - string
            - "null"
          description: Dispute resolution comment left by support team when resolving a
            dispute
        dispute_resolution_attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
          description: Dispute resolution attachments uploaded by support team when
            resolving a dispute
        cancel_reason:
          oneOf:
            - $ref: "#/components/schemas/CancelReason"
            - type: "null"
        cancel_comment:
          type:
            - string
            - "null"
          description: Cancel comment left by buyer or seller when canceling a deal
        canceled_by:
          type: string
          enum:
            - buyer
            - seller
            - broker
            - staff
        payment:
          oneOf:
            - $ref: "#/components/schemas/Payment"
            - type: "null"
      examples:
        - id: DL-10001
          created_at: 1679568486000
          updated_at: 1679568486000
          number: DL-10001
          offer:
            id: "1"
            number: OF-10001
            title: iPhone 12 for sale
            description: Brand new iPhone 12 for sale. Unlocked, with original box and
              accessories.
            type: product
            category:
              id: "1"
              name: Electronics
            price: "1000.00"
            price_type: per_item
          subject_details: The item is brand new, still in its original packaging. It has
            never been used and is in perfect condition.
          buyer:
            id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
            number: IC-0001
            full_name: John Dou
            email: john.dou@example.com
            phone: "+966572000000"
            user_type: regular
            status: active
          seller:
            id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
            number: IC-0001
            full_name: John Dou
            email: john.dou@example.com
            phone: "+966572000000"
            user_type: regular
            status: active
          billing_address:
            id: 1
            city:
              id: 100
              name: Riyadh
            district: Al Olaya
            street: Al Olaya, Riyadh
            building_number: "123"
            unit_number: "456"
            zip_code: "12345"
          delivery_address:
            id: 2
            city:
              id: 100
              name: Riyadh
            district: Al Olaya
            street: Al Olaya, Riyadh
            building_number: "123"
            unit_number: "456"
            zip_code: "12345"
          price: "1000.00"
          delivery_fee: "50.00"
          buyer_fee: "33.00"
          seller_fee: "0.00"
          service_fee: "20.00"
          total: "1083.00"
          status: requested
          seller_amount_transfered: false
          dispute_reason:
            id: 1
            name: Item not received
          dispute_comment: I haven't received the item yet.
          dispute_attachments:
            - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
              type: picture
              status: available
              object_url: https://example.com/dispute_attachment.jpg
              object_width: 800
              object_height: 600
              preview_url: https://example.com/dispute_attachment_preview.jpg
              preview_width: 200
              preview_height: 150
              title: Dispute Attachment
              filename: dispute_attachment.jpg
              size_bytes: 204800
              duration: 0
              uploaded_at: 1679654886000
          dispute_resolution_reason:
            id: 1
            name: Item delivered to wrong address
          dispute_resolution_comment: After investigation, we found that the item was
            delivered to the wrong address. We are working with the delivery
            company to resolve this issue.
          dispute_resolution_attachments:
            - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
              type: picture
              status: available
              object_url: https://example.com/delivery_proof.jpg
              object_width: 800
              object_height: 600
              preview_url: https://example.com/delivery_proof_preview.jpg
              preview_width: 200
              preview_height: 150
              title: Delivery Proof
              filename: delivery_proof.jpg
              size_bytes: 204800
              duration: 0
              uploaded_at: 1679654886000
          cancel_reason:
            id: 1
            name: Buyer changed mind
          cancel_comment: I want to cancel this deal because I changed my mind.
          canceled_by: buyer
          payment:
            id: 1
            created_at: 1679568486000
            updated_at: 1679568486000
            provider: hyperpay
            status: paid
            substatus: null
            amount: "1083.00"
    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        secret_key:
          type:
            - string
            - "null"
          description: Secret key for signing webhook payloads. Secret key is returned
            only at the moment of webhook creation and cannot be retrieved
            later, so make sure to save it in a secure place.
      examples:
        - id: 1f526b38-0869-11eb-9f01-cb90251d5fe7
